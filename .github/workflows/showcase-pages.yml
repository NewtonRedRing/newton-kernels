name: Publish capability showcase
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'tools/build_showcase.py'
      - 'benchmarks/results/github-actions-2026-11-02-5889b44/results.json'
      - 'benchmarks/results/local-extended-2026-11-02/results.json'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-showcase
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Check evidence is verified and site data are current
        run: python3 tools/build_showcase.py --check
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload self-contained site
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
