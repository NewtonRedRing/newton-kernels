name: Publish capability showcase
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'tools/build_showcase.py'
      - 'benchmarks/results/github-actions-2026-11-02-a3ccc65/results.json'
      - 'benchmarks/results/local-extended-2026-11-02/results.json'
      - '.github/workflows/showcase-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-showcase
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Check evidence is verified and site data are current
        run: python3 tools/build_showcase.py --check
      # Keep an inspectable static build even before Pages is enabled by an owner.
      - name: Upload downloadable showcase preview
        uses: actions/upload-artifact@v4
        with:
          name: newton-kernels-site-preview
          path: showcase/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      # GitHub's default GITHUB_TOKEN cannot create the Pages site. An owner
      # must select Settings -> Pages -> Source: GitHub Actions once.
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload self-contained site
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
