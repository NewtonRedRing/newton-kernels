name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNEWTON_BUILD_TESTS=ON -DNEWTON_BUILD_EXAMPLES=ON -DNEWTON_BUILD_C_API=ON -DNEWTON_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix stage
      - name: Verify installed package in a separate consumer project
        run: |
          cmake -S tests/consumer -B consumer-build "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/stage" "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}"
          cmake --build consumer-build --config ${{ matrix.build_type }} --parallel 2
          ctest --test-dir consumer-build -C ${{ matrix.build_type }} --output-on-failure
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DNEWTON_ENABLE_SANITIZERS=ON -DNEWTON_BUILD_TESTS=ON -DNEWTON_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Test read-only benchmark triage tool
        run: python3 -m unittest discover -s tests -p 'test_benchmark_report_triage.py' -v

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang fuzz targets
        run: cmake -S . -B fuzz-build -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNEWTON_BUILD_FUZZERS=ON -DNEWTON_BUILD_TESTS=OFF -DNEWTON_BUILD_EXAMPLES=OFF
      - name: Build fuzz targets
        run: cmake --build fuzz-build --target newton_csv_fuzzer --parallel 2
      - name: Fuzz bounded randomized CSV inputs under sanitizers
        run: ./fuzz-build/fuzz/newton_csv_fuzzer -runs=5000 -max_len=1024 -timeout=5
