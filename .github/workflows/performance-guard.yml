name: Performance regression guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression_guard:
    name: regression-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANCHOR_SHA: a3ccc65021181561aec1c8fe284bdeb7c8e1234c
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Check out merge base
        uses: actions/checkout@v4
        with:
          path: base
          ref: ${{ env.BASE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check out published 22-case evidence revision
        uses: actions/checkout@v4
        with:
          path: anchor
          ref: ${{ env.ANCHOR_SHA }}
          persist-credentials: false
      - name: Verify benchmark guard policy tests
        run: python3 -m unittest discover -s candidate/tests -p 'test_performance_guard.py' -v
      - name: Verify CSV pipeline regression policy tests
        run: python3 -m unittest discover -s candidate/tests -p 'test_pipeline_regression_guard.py' -v
      - name: Verify append-only high-water lock policy tests
        run: python3 -m unittest discover -s candidate/tests -p 'test_performance_locks.py' -v
      - name: Validate approved high-water revisions and check out pinned source
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/tools/performance_locks.py validate \
            --base base/tools/performance-locks.json \
            --candidate candidate/tools/performance-locks.json
          mkdir -p locked-src
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            if ! git -C base merge-base --is-ancestor "$sha" HEAD; then
              echo "LOCK POLICY ERROR: $sha is not a merged ancestor of base" >&2
              exit 1
            fi
            git -C candidate fetch --no-tags --depth=1 origin "$sha"
            git -C candidate worktree add --detach "$GITHUB_WORKSPACE/locked-src/$sha" "$sha"
          done < <(python3 candidate/tools/performance_locks.py refs \
                    --manifest candidate/tools/performance-locks.json)
      - name: Compile all three revisions with identical flags and toolchain
        shell: bash
        run: |
          set -euo pipefail
          for revision in candidate base anchor; do
            cmake -S "$revision" -B "build-$revision" -DCMAKE_BUILD_TYPE=Release \
              -DNEWTON_BUILD_TESTS=OFF -DNEWTON_BUILD_EXAMPLES=OFF \
              -DNEWTON_BUILD_BENCHMARKS=ON -DNEWTON_EXTERNAL_BENCHMARKS=ON \
              -DNEWTON_COMP_BENCH_WITH_BOOST=OFF -DNEWTON_COMP_BENCH_WITH_VINCE=OFF
            if [[ "$revision" == "anchor" ]]; then
              cmake --build "build-$revision" \
                --target newton_compare newton_compare_extended --parallel 2
            else
              cmake --build "build-$revision" \
                --target newton_compare newton_compare_extended newton_pipeline_compare --parallel 2
            fi
          done
      - name: Compile every pinned high-water source with the exact benchmark flags
        shell: bash
        run: |
          set -euo pipefail
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            cmake -S "locked-src/$sha" -B "build-locked/$sha" -DCMAKE_BUILD_TYPE=Release \
              -DNEWTON_BUILD_TESTS=OFF -DNEWTON_BUILD_EXAMPLES=OFF \
              -DNEWTON_BUILD_BENCHMARKS=ON -DNEWTON_EXTERNAL_BENCHMARKS=ON \
              -DNEWTON_COMP_BENCH_WITH_BOOST=OFF -DNEWTON_COMP_BENCH_WITH_VINCE=OFF
            cmake --build "build-locked/$sha" \
              --target newton_compare newton_compare_extended --parallel 2
          done < <(python3 candidate/tools/performance_locks.py refs \
                    --manifest candidate/tools/performance-locks.json)
      - name: Detect identical protected source code versus main
        shell: bash
        run: |
          set -euo pipefail
          if diff -q \
              <(git -C candidate ls-tree -r HEAD -- CMakeLists.txt CMakePresets.json cmake src include benchmarks) \
              <(git -C base ls-tree -r HEAD -- CMakeLists.txt CMakePresets.json cmake src include benchmarks) >/dev/null; then
            echo "PROTECTED_CODE_IDENTICAL=1" >> "$GITHUB_ENV"
          else
            echo "PROTECTED_CODE_IDENTICAL=0" >> "$GITHUB_ENV"
          fi
      - name: Check every established benchmark against previous and published revisions
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/tools/performance_guard.py \
            --candidate-classic build-candidate/benchmarks/competitors/newton_compare \
            --candidate-extended build-candidate/benchmarks/competitors/newton_compare_extended \
            --base-classic build-base/benchmarks/competitors/newton_compare \
            --base-extended build-base/benchmarks/competitors/newton_compare_extended \
            --anchor-classic build-anchor/benchmarks/competitors/newton_compare \
            --anchor-extended build-anchor/benchmarks/competitors/newton_compare_extended \
            --candidate-sha "$CANDIDATE_SHA" --base-sha "$BASE_SHA" \
            --out performance-evidence --protected-code-identical "$PROTECTED_CODE_IDENTICAL" \
            --rounds 5 --repetitions 11 \
            --max-regression-pct 3.0 --min-slow-rounds 4
      - name: Guard existing owned, fused and fast CSV pipeline cases
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/tools/pipeline_regression_guard.py \
            --candidate build-candidate/benchmarks/newton_pipeline_compare \
            --base build-base/benchmarks/newton_pipeline_compare \
            --out performance-evidence \
            --protected-code-identical "$PROTECTED_CODE_IDENTICAL" \
            --rounds 7 --max-regression-pct 3 --min-slow-rounds 5
      - name: Check every approved high-water mark using current same-host samples
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/tools/performance_locks.py run \
            --manifest candidate/tools/performance-locks.json \
            --build-root build-locked \
            --candidate-classic build-candidate/benchmarks/competitors/newton_compare \
            --candidate-extended build-candidate/benchmarks/competitors/newton_compare_extended \
            --candidate-sha "$CANDIDATE_SHA" \
            --protected-code-identical "$PROTECTED_CODE_IDENTICAL" \
            --out performance-evidence
      - name: Suggest review-only high-water promotions after passing main checks
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 candidate/tools/performance_locks.py propose \
            --manifest candidate/tools/performance-locks.json \
            --report performance-evidence/results.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --evidence "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out performance-evidence/high-water-proposals.json
      - name: Upload unfiltered samples and regression decisions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-guard-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-evidence/
          if-no-files-found: warn
